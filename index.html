<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>TeleStream</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#17212b;color:#fff}
#app{width:100%;max-width:520px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:#17212b;position:relative}

/* ЭКРАНЫ */
#screens{flex:1;position:relative;overflow:hidden;min-height:0}
.screen{position:absolute;top:0;left:0;right:0;bottom:0;display:none;flex-direction:column;background:#17212b}
.screen.on{display:flex}

/* ШАПКА */
.hdr{display:flex;align-items:center;gap:8px;padding:12px 14px;background:#1c2733;flex-shrink:0;padding-top:max(12px,env(safe-area-inset-top));box-shadow:0 2px 8px rgba(0,0,0,.3);z-index:5}
.hdr h1{font-size:17px;font-weight:700;flex:1;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr button{width:42px;height:42px;border-radius:50%;background:transparent;border:none;color:#fff;font-size:22px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.hdr button:active{background:rgba(255,255,255,.15)}

/* КОНТЕНТ */
.content{flex:1;overflow-y:auto;min-height:0}
.content::-webkit-scrollbar{width:0}

/* НИЖНЕЕ МЕНЮ */
#nav{display:flex;background:#1c2733;border-top:1px solid rgba(255,255,255,.08);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom);z-index:20}
#nav button{flex:1;padding:10px 0 12px;background:none;border:none;color:#7d8e9e;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-family:inherit}
#nav button .ic{font-size:24px;line-height:1}
#nav button.on{color:#64b5f6}
#nav.hide{display:none}

/* АВТОРИЗАЦИЯ */
.auth{padding:50px 24px;display:flex;flex-direction:column;gap:14px}
.auth h1{font-size:30px;font-weight:900;text-align:center;margin-bottom:20px;color:#64b5f6}
.auth input{background:#232e3c;border:none;border-radius:12px;padding:15px;color:#fff;font-size:16px;outline:none}
.auth input:focus{border-color:#64b5f6}
.auth button{background:linear-gradient(135deg,#5288c1,#3a6ba5);border:none;border-radius:12px;padding:16px;color:#fff;font-size:16px;font-weight:800;cursor:pointer}
.auth button.alt{background:#232e3c}
.auth button:active{transform:scale(.98)}

/* ЧАТЫ */
.chat{padding:12px 16px;display:flex;gap:14px;cursor:pointer;align-items:center;border-bottom:1px solid rgba(255,255,255,.03)}
.chat:active{background:rgba(255,255,255,.06)}
.av{width:52px;height:52px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;background:linear-gradient(135deg,#5288c1,#3a6ba5);color:#fff}
.ci{flex:1;min-width:0}
.cn{font-size:16px;font-weight:700}
.cl{font-size:13px;color:#7d8e9e;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* СООБЩЕНИЯ */
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;min-height:0}
.msgs::-webkit-scrollbar{width:0}
.msg{max-width:78%;padding:9px 13px;border-radius:15px;font-size:15px;word-wrap:break-word;line-height:1.35}
.msg.in{background:#232e3c;align-self:flex-start;border-bottom-left-radius:4px}
.msg.out{background:#5288c1;align-self:flex-end;border-bottom-right-radius:4px}
.msg.sticker{background:none;font-size:60px;padding:2px 6px;line-height:1}

/* ПОЛЕ ВВОДА */
.comp{padding:8px 10px;background:#1c2733;display:flex;gap:6px;align-items:center;flex-shrink:0;padding-bottom:max(8px,env(safe-area-inset-bottom))}
.comp textarea{flex:1;background:#232e3c;border:none;border-radius:20px;padding:11px 15px;color:#fff;font-size:15px;outline:none;resize:none;min-height:44px;max-height:90px;font-family:inherit}
.comp button{width:44px;height:44px;border-radius:50%;border:none;background:#232e3c;color:#fff;font-size:20px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.comp button.send{background:#5288c1}
.comp button:active{transform:scale(.9)}

/* ПАНЕЛЬ ЭМОДЗИ */
.panel{background:#1c2733;border-top:1px solid rgba(255,255,255,.08);display:none;max-height:250px;overflow-y:auto;flex-shrink:0}
.panel.on{display:block}
.tabs{display:flex;border-bottom:1px solid rgba(255,255,255,.08)}
.tabs button{flex:1;padding:11px;background:none;border:none;color:#7d8e9e;font-size:13px;font-weight:700;cursor:pointer;border-bottom:2px solid transparent}
.tabs button.on{color:#64b5f6;border-bottom-color:#64b5f6}
.grid-e{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:10px}
.grid-e button{background:none;border:none;font-size:26px;padding:5px;cursor:pointer;border-radius:8px;line-height:1}
.grid-e button:active{background:rgba(255,255,255,.1)}
.grid-s{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px}
.grid-s button{background:rgba(255,255,255,.05);border:none;font-size:52px;padding:6px;cursor:pointer;border-radius:12px;line-height:1}
.grid-s button:active{background:rgba(255,255,255,.15)}

/* ЮЗЕРЫ */
.usr{padding:12px 14px;display:flex;gap:12px;align-items:center;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.03)}
.usr:active{background:rgba(255,255,255,.06)}

/* ПРОФИЛЬ */
.pcard{margin:14px;background:#1c2733;border-radius:16px;padding:24px;text-align:center}
.pav{width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,#5288c1,#3a6ba5);display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:800;margin:0 auto 14px}

/* TOAST */
#toast{position:fixed;top:70px;left:50%;transform:translate(-50%,-200%);background:#232e3c;padding:12px 22px;border-radius:24px;font-size:13px;font-weight:700;z-index:999;transition:transform .3s;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis;pointer-events:none;box-shadow:0 8px 30px rgba(0,0,0,.6)}
#toast.on{transform:translate(-50%,0)}
#toast.ok{background:linear-gradient(135deg,#4ade80,#22c55e)}
#toast.err{background:linear-gradient(135deg,#ef4444,#dc2626)}
</style>
</head>
<body>
<div id="app">

<div id="screens">

  <!-- АВТОРИЗАЦИЯ -->
  <div class="screen on" id="s-auth">
    <div class="auth">
      <h1>TeleStream</h1>
      <input id="email" type="email" placeholder="Email">
      <input id="password" type="password" placeholder="Пароль">
      <button onclick="doLogin()">Войти</button>
      <button class="alt" onclick="doSignup()">Зарегистрироваться</button>
    </div>
  </div>

  <!-- СПИСОК ЧАТОВ -->
  <div class="screen" id="s-chats">
    <div class="hdr">
      <h1>Чаты</h1>
      <button onclick="showUsers()">✏️</button>
    </div>
    <div class="content" id="chatList"></div>
  </div>

  <!-- ЧАТ -->
  <div class="screen" id="s-chat">
    <div class="hdr">
      <button onclick="backToChats()">←</button>
      <h1 id="chatTitle">Чат</h1>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="panel" id="panel">
      <div class="tabs">
        <button id="tabE" class="on" onclick="switchTab('e')">😀 Смайлики</button>
        <button id="tabS" onclick="switchTab('s')">🎨 Стикеры</button>
      </div>
      <div id="emojiGrid" class="grid-e"></div>
      <div id="stickerGrid" class="grid-s" style="display:none"></div>
    </div>
    <div class="comp">
      <button onclick="togglePanel('e')">😀</button>
      <textarea id="msgInput" rows="1" placeholder="Сообщение..."></textarea>
      <button onclick="togglePanel('s')">🎨</button>
      <button class="send" onclick="sendText()">➤</button>
    </div>
  </div>

  <!-- ЮЗЕРЫ -->
  <div class="screen" id="s-users">
    <div class="hdr">
      <button onclick="go('chats')">←</button>
      <h1>Пользователи</h1>
    </div>
    <div class="content" id="usersList"></div>
  </div>

  <!-- ПРОФИЛЬ -->
  <div class="screen" id="s-profile">
    <div class="hdr"><h1>Профиль</h1></div>
    <div class="content">
      <div class="pcard">
        <div class="pav" id="pAv">U</div>
        <div style="font-size:18px;font-weight:800" id="pName">—</div>
        <div style="font-size:13px;color:#7d8e9e;margin-top:6px" id="pEmail">—</div>
        <button onclick="logout()" style="margin-top:22px;background:#232e3c;border:none;border-radius:12px;padding:12px 24px;color:#fff;font-weight:700;cursor:pointer;font-size:15px">Выйти</button>
      </div>
    </div>
  </div>

</div>

<!-- НИЖНЕЕ МЕНЮ -->
<div id="nav" class="hide">
  <button id="navChats" onclick="go('chats')"><span class="ic">💬</span>Чаты</button>
  <button id="navProfile" onclick="go('profile')"><span class="ic">👤</span>Профиль</button>
</div>

</div>
<div id="toast"></div>

<script>
var SUPA_URL = 'https://zpigttxrheaucaxwogzx.supabase.co';
var SUPA_KEY = 'sb_publishable_yHk6z7Jf3RTo5EexcTbjBg_XqQDEvSf';
var sb = null;
var me = null, myProfile = null, currentChatId = null, msgChannel = null;

var EMOJI = '😀 😃 😄 😁 😆 😅 🤣 😂 🙂 🙃 😉 😊 😇 🥰 😍 🤩 😘 😗 😚 😙 🥲 😋 😛 😜 🤪 😝 🤑 🤗 🤭 🤫 🤔 🤐 😐 😑 😶 😏 😒 🙄 😬 🤥 😌 😔 😪 🤤 😴 😷 🤒 🤕 🤢 🤮 🤧 🥵 🥶 🥴 😵 🤯 🤠 🥳 🥺 😢 😭 😱 😖 😣 😞 😓 😩 😫 🥱 😤 😡 🤬 😈 👿 💀 💩 🤡 👹 👺 👻 ❤️ 🧡 💛 💚 💙 💜 🖤 🤍 💔 ❣️ 💕 💞 💓 💗 💖 💘 👍 👎 👌 ✌️ 🤞 🤟 🤘 🤙 👈 👉 👆 👇 ☝️ ✋ 🤚 🔥 ⭐ ✨ 💫 ⚡ 💥 💯 🎉 🎊 🎁 🎂 🍕 🍔 🍟 ☕ 🍺'.split(' ');
var STICKERS = '😺 😸 😹 😻 😼 😽 🙀 😿 😾 🐶 🐱 🐭 🐹 🐰 🦊 🐻 🐼 🐨 🐯 🦁 🐮 🐷 🐸 🐵 🦄 🐔 🐧 🐦 🦆 🦉 🦇 🐺 🎃 🎄 🎆 🎇 🧨 ✨ 🎈 🎉 🎊 🎁 🎀 🎂 🍰 🧁 🍭 🍬 💖 💗 💓 💞 💕 💘 💝 💟 ❤️ 🧡 💛 💚 💙 💜 🤎 🖤'.split(' ');

function $(id){ return document.getElementById(id); }
function toast(msg, type){
  var t = $('toast');
  t.textContent = msg;
  t.className = 'on' + (type ? ' ' + type : '');
  clearTimeout(t._t);
  t._t = setTimeout(function(){ t.className = ''; }, 2200);
}
function esc(s){ return String(s||'').replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

function go(name){
  var all = document.querySelectorAll('.screen');
  for(var i=0;i<all.length;i++) all[i].classList.remove('on');
  var s = $('s-' + name);
  if(s) s.classList.add('on');
  $('navChats').classList.toggle('on', name === 'chats');
  $('navProfile').classList.toggle('on', name === 'profile');
  var hideNav = (name === 'auth' || name === 'chat' || name === 'users');
  $('nav').classList.toggle('hide', hideNav);

  if(name === 'chats') loadChats();
  if(name === 'profile') renderProfile();
}

async function doLogin(){
  var e = $('email').value.trim(), p = $('password').value;
  if(!e || !p) return toast('Заполни поля', 'err');
  var r = await sb.auth.signInWithPassword({ email: e, password: p });
  if(r.error) return toast(r.error.message, 'err');
  toast('Добро пожаловать!', 'ok');
}
async function doSignup(){
  var e = $('email').value.trim(), p = $('password').value;
  if(!e || !p) return toast('Заполни поля', 'err');
  if(p.length < 6) return toast('Пароль минимум 6 символов', 'err');
  var r = await sb.auth.signUp({ email: e, password: p });
  if(r.error) return toast(r.error.message, 'err');
  toast('Готово! Проверь почту', 'ok');
}
async function logout(){ await sb.auth.signOut(); }

async function loadChats(){
  var box = $('chatList');
  box.innerHTML = '<div style="padding:20px;text-align:center;color:#7d8e9e">Загрузка...</div>';
  var r = await sb.from('chats').select('*').or('user1.eq.'+me.id+',user2.eq.'+me.id);
  var chats = r.data || [];
  if(!chats.length){
    box.innerHTML = '<div style="padding:60px 30px;text-align:center;color:#7d8e9e;font-size:14px;line-height:1.7">Чатов пока нет.<br><br>Нажми <b>✏️</b> сверху,<br>чтобы найти собеседника.</div>';
    return;
  }
  var others = chats.map(function(c){ return c.user1 === me.id ? c.user2 : c.user1; });
  var pr = await sb.from('profiles').select('id,username').in('id', others);
  var names = {};
  (pr.data || []).forEach(function(p){ names[p.id] = p.username; });
  box.innerHTML = '';
  chats.forEach(function(c){
    var oid = c.user1 === me.id ? c.user2 : c.user1;
    var name = names[oid] || 'Пользователь';
    var d = document.createElement('div');
    d.className = 'chat';
    d.innerHTML = '<div class="av">' + esc(name[0].toUpperCase()) + '</div>' +
      '<div class="ci"><div class="cn">' + esc(name) + '</div><div class="cl">Нажми чтобы открыть</div></div>';
    d.onclick = function(){ openChat(c.id, oid, name); };
    box.appendChild(d);
  });
}

async function showUsers(){
  go('users');
  var box = $('usersList');
  box.innerHTML = '<div style="padding:20px;text-align:center;color:#7d8e9e">Загрузка...</div>';
  var r = await sb.from('profiles').select('id,username').neq('id', me.id).order('username');
  var users = r.data || [];
  if(!users.length){
    box.innerHTML = '<div style="padding:60px 30px;text-align:center;color:#7d8e9e;font-size:14px;line-height:1.7">Других пользователей нет.<br><br>Зарегистрируйся<br>с другого устройства<br>с другим email.</div>';
    return;
  }
  box.innerHTML = '';
  users.forEach(function(u){
    var d = document.createElement('div');
    d.className = 'usr';
    d.innerHTML = '<div class="av" style="width:44px;height:44px;font-size:18px">' + esc(u.username[0].toUpperCase()) + '</div>' +
      '<div style="flex:1"><div style="font-weight:700">' + esc(u.username) + '</div>' +
      '<div style="font-size:12px;color:#7d8e9e">Нажми чтобы открыть</div></div>';
    d.onclick = function(){ startChatWith(u); };
    box.appendChild(d);
  });
}

async function startChatWith(user){
  var r = await sb.from('chats').select('*').or('and(user1.eq.'+me.id+',user2.eq.'+user.id+'),and(user1.eq.'+user.id+',user2.eq.'+me.id+')').maybeSingle();
  if(r.data){ openChat(r.data.id, user.id, user.username); return; }
  var c = await sb.from('chats').insert({ user1: me.id, user2: user.id }).select().single();
  if(c.error){ toast(c.error.message, 'err'); return; }
  openChat(c.data.id, user.id, user.username);
}

async function openChat(cid, oid, name){
  currentChatId = cid;
  $('chatTitle').textContent = name;
  go('chat');
  var r = await sb.from('messages').select('*').eq('chat_id', cid).order('created_at', { ascending: true });
  var box = $('msgs');
  box.innerHTML = '';
  (r.data || []).forEach(function(m){ addMsg(m); });
  box.scrollTop = box.scrollHeight;
  if(msgChannel) sb.removeChannel(msgChannel);
  msgChannel = sb.channel('c-' + cid)
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'messages', filter:'chat_id=eq.' + cid },
      function(p){ addMsg(p.new); })
    .subscribe();
}

function addMsg(m){
  var box = $('msgs');
  var d = document.createElement('div');
  var mine = m.sender === me.id;
  if(m.is_sticker){
    d.className = 'msg sticker ' + (mine ? 'out' : 'in');
    d.textContent = m.text;
  } else {
    d.className = 'msg ' + (mine ? 'out' : 'in');
    d.textContent = m.text;
  }
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}

function backToChats(){
  if(msgChannel){ sb.removeChannel(msgChannel); msgChannel = null; }
  currentChatId = null;
  go('chats');
}

async function sendText(){
  var inp = $('msgInput');
  var t = inp.value.trim();
  if(!t || !currentChatId) return;
  inp.value = '';
  inp.style.height = '44px';
  var r = await sb.from('messages').insert({ chat_id: currentChatId, sender: me.id, text: t, is_sticker: false });
  if(r.error) toast(r.error.message, 'err');
}

async function sendSticker(s){
  if(!currentChatId) return;
  var r = await sb.from('messages').insert({ chat_id: currentChatId, sender: me.id, text: s, is_sticker: true });
  if(r.error) toast(r.error.message, 'err');
  $('panel').classList.remove('on');
}

function buildPanels(){
  var eg = $('emojiGrid');
  EMOJI.forEach(function(e){
    var b = document.createElement('button');
    b.textContent = e;
    b.onclick = function(){
      var inp = $('msgInput');
      inp.value += e;
      inp.focus();
    };
    eg.appendChild(b);
  });
  var sg = $('stickerGrid');
  STICKERS.forEach(function(s){
    var b = document.createElement('button');
    b.textContent = s;
    b.onclick = function(){ sendSticker(s); };
    sg.appendChild(b);
  });
}
function togglePanel(mode){
  $('panel').classList.toggle('on');
  switchTab(mode);
}
function switchTab(mode){
  if(mode === 'e'){
    $('emojiGrid').style.display = 'grid';
    $('stickerGrid').style.display = 'none';
    $('tabE').classList.add('on');
    $('tabS').classList.remove('on');
  } else {
    $('emojiGrid').style.display = 'none';
    $('stickerGrid').style.display = 'grid';
    $('tabE').classList.remove('on');
    $('tabS').classList.add('on');
  }
  $('panel').classList.add('on');
}

function renderProfile(){
  if(!myProfile || !me) return;
  $('pAv').textContent = (myProfile.username || 'U')[0].toUpperCase();
  $('pName').textContent = myProfile.username || '—';
  $('pEmail').textContent = me.email || '—';
}

document.addEventListener('input', function(e){
  if(e.target && e.target.id === 'msgInput'){
    e.target.style.height = 'auto';
    e.target.style.height = Math.min(90, e.target.scrollHeight) + 'px';
  }
});
document.addEventListener('keydown', function(e){
  if(e.target && e.target.id === 'msgInput' && e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendText();
  }
});

// ==== СТАРТ ====
sb = supabase.createClient(SUPA_URL, SUPA_KEY);
buildPanels();

sb.auth.onAuthStateChange(async function(event, session){
  if(session && session.user){
    me = session.user;
    var r = await sb.from('profiles').select('*').eq('id', me.id).single();
    if(!r.data){
      await sb.from('profiles').insert({ id: me.id, username: me.email.split('@')[0] });
      var r2 = await sb.from('profiles').select('*').eq('id', me.id).single();
      r.data = r2.data;
    }
    myProfile = r.data;
    go('chats');
  } else {
    me = null; myProfile = null;
    if(msgChannel){ sb.removeChannel(msgChannel); msgChannel = null; }
    go('auth');
  }
});

sb.auth.getSession().then(function(s){
  if(!s.data.session) go('auth');
});
</script>
</body>
</html>
